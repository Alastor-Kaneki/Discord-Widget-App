name: Preserve Discord Social SDK

on:
  push:
    branches:
      - agent/oauth-session-messaging

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-latest
    env:
      SDK_URL: "https://storage.googleapis.com/discord-slayer-sdk-artifacts/discord_partner_sdk/4b32d8349d0a127af011f26eebb722ff0646f856/release/DiscordSocialSdk-1.10.18247.zip?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=slayer-sdk-token-creator%40discord-production.iam.gserviceaccount.com%2F20260731%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260731T210958Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"
    steps:
      - uses: actions/checkout@v4
      - name: Download SDK
        run: |
          mkdir -p sdk/unpacked
          curl --fail --location --retry 3 --output sdk/DiscordSocialSdk-1.10.18247.zip "$SDK_URL"
          unzip -q sdk/DiscordSocialSdk-1.10.18247.zip -d sdk/unpacked
          AAR_PATH="$(find sdk/unpacked -type f -name 'discord_partner_sdk.aar' | head -n 1)"
          test -n "$AAR_PATH"
          cp "$AAR_PATH" sdk/discord_partner_sdk.aar
      - uses: actions/upload-artifact@v4
        with:
          name: Discord-Social-SDK-1.10.18247-private
          path: |
            sdk/DiscordSocialSdk-1.10.18247.zip
            sdk/discord_partner_sdk.aar
          if-no-files-found: error
