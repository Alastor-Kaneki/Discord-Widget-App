name: Bootstrap project

on:
  push:
    paths:
      - bootstrap/discord-widget-project.tar.gz.b64

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d bootstrap/discord-widget-project.tar.gz.b64 | tar -xz
          rm -rf bootstrap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build Discord widget app"
          git push
