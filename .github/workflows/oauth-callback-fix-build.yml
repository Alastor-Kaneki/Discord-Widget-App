name: OAuth Callback Fix Build

on:
  push:
    branches:
      - agent/fix-oauth-return
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: sdk-cache/discord_partner_sdk.aar
          key: discord-social-sdk-1.10.18247

      - if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: Discord-Social-SDK-1.10.18247-private
          path: sdk-download
          repository: Alastor-Kaneki/Discord-Widget-App
          run-id: 30667859504
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sdk-cache
          cp sdk-download/discord_partner_sdk.aar sdk-cache/discord_partner_sdk.aar

      - if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk-cache/discord_partner_sdk.aar
          key: discord-social-sdk-1.10.18247

      - run: |
          mkdir -p app/discord_social_sdk
          cp sdk-cache/discord_partner_sdk.aar app/discord_social_sdk/discord_partner_sdk.aar

      - run: gradle --no-daemon assembleDebug

      - run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > merged-manifest.bin
          python3 - <<'PY'
          from pathlib import Path
          data = Path('merged-manifest.bin').read_bytes()
          scheme = 'discord-1532856977225551912'.encode('utf-16le')
          callback = 'com.alastorkaneki.discordwidget.DiscordOAuthCallbackActivity'.encode('utf-16le')
          if scheme not in data:
              raise SystemExit('OAuth redirect scheme missing from packaged manifest')
          if callback not in data:
              raise SystemExit('App-owned OAuth callback activity missing from packaged manifest')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Discord-Widget-App-v0.3.1-oauth-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - if: steps.sdk-cache.outputs.cache-hit != 'true' && always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE repos/Alastor-Kaneki/Discord-Widget-App/actions/artifacts/8807665711
