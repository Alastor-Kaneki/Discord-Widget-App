name: SelfRPC Android APK
on:
  push:
    branches:
      - 'build/selfrpc-20261014'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack SelfRPC sources
        run: |
          base64 --decode selfrpc-payload.b64 > source.zip
          unzip -q source.zip
          test -f SelfRPC/app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        working-directory: SelfRPC
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SelfRPC-debug-apk
          path: SelfRPC/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
