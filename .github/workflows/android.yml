name: Android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDK_URL: "https://storage.googleapis.com/discord-slayer-sdk-artifacts/discord_partner_sdk/4b32d8349d0a127af011f26eebb722ff0646f856/release/DiscordSocialSdk-1.10.18247.zip?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=slayer-sdk-token-creator%40discord-production.iam.gserviceaccount.com%2F20260731%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260731T210958Z&X-Goog-Expires=3600&X-Goog-SignedHeaders=host&X-Goog-"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Prepare Discord Social SDK
        run: |
          mkdir -p sdk-download app/discord_social_sdk
          curl --fail --location --retry 3 --output sdk-download/discord-social-sdk.zip "$SDK_URL"
          unzip -q sdk-download/discord-social-sdk.zip -d sdk-download/unpacked
          find sdk-download/unpacked -maxdepth 6 -type f | sort
          AAR_PATH="$(find sdk-download/unpacked -type f -name 'discord_partner_sdk.aar' | head -n 1)"
          if [ -z "$AAR_PATH" ]; then
            AAR_PATH="$(find sdk-download/unpacked -type f -name '*.aar' | head -n 1)"
          fi
          if [ -z "$AAR_PATH" ]; then
            echo "No Android AAR found in Discord Social SDK archive" >&2
            exit 1
          fi
          cp "$AAR_PATH" app/discord_social_sdk/discord_partner_sdk.aar
          ls -lh app/discord_social_sdk/discord_partner_sdk.aar

      - run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Discord-Widget-App-v0.2.1-oauth-debug
          path: app/build/outputs/apk/debug/*.apk
